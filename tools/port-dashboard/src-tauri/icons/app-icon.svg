<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0a0a14"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7ecfff"/>
      <stop offset="100%" style="stop-color:#4a9eff"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#2a2a4a" stroke-width="8"/>

  <!-- Progress arc (representing port progress) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#glow)" stroke-width="8"
          stroke-dasharray="850 1131" stroke-linecap="round"
          transform="rotate(-90 256 256)"/>

  <!-- Inner circuit pattern -->
  <g stroke="#3a3a5a" stroke-width="2" fill="none">
    <path d="M256 120 L256 180"/>
    <path d="M256 332 L256 392"/>
    <path d="M120 256 L180 256"/>
    <path d="M332 256 L392 256"/>
    <path d="M170 170 L200 200"/>
    <path d="M342 170 L312 200"/>
    <path d="M170 342 L200 312"/>
    <path d="M342 342 L312 312"/>
  </g>

  <!-- Center node - ARM chip representation -->
  <rect x="196" y="196" width="120" height="120" rx="12" fill="#12121a" stroke="#4a4a6a" stroke-width="3" filter="url(#shadow)"/>

  <!-- ARM text -->
  <text x="256" y="240" font-family="SF Mono, Monaco, monospace" font-size="28" font-weight="bold" fill="#ffd700" text-anchor="middle">ARM</text>
  <text x="256" y="275" font-family="SF Mono, Monaco, monospace" font-size="20" fill="#51cf66" text-anchor="middle">64</text>

  <!-- Pin dots -->
  <g fill="#7ecfff">
    <circle cx="216" cy="186" r="4"/>
    <circle cx="256" cy="186" r="4"/>
    <circle cx="296" cy="186" r="4"/>
    <circle cx="216" cy="326" r="4"/>
    <circle cx="256" cy="326" r="4"/>
    <circle cx="296" cy="326" r="4"/>
    <circle cx="186" cy="216" r="4"/>
    <circle cx="186" cy="256" r="4"/>
    <circle cx="186" cy="296" r="4"/>
    <circle cx="326" cy="216" r="4"/>
    <circle cx="326" cy="256" r="4"/>
    <circle cx="326" cy="296" r="4"/>
  </g>

  <!-- Phase indicators (like status LEDs) -->
  <circle cx="140" cy="140" r="12" fill="#51cf66" opacity="0.9"/>
  <circle cx="372" cy="140" r="12" fill="#ffd700" opacity="0.9"/>
  <circle cx="140" cy="372" r="12" fill="#555" opacity="0.5"/>
  <circle cx="372" cy="372" r="12" fill="#555" opacity="0.5"/>
</svg>
